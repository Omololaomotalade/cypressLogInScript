version: "1"
services:
  web:
    platform: linux/x86_64
    build: .
    ports:
      - 8001:80
    volumes:
      - ./:/var/www/
    env_file:
      - .env
    container_name: KongaPayCypress
    networks:
      - servers_external_network
    tty: true
networks:
  servers_external_network:
    external: true